        // ---------- HELPERS ----------
        const formatDate = (dateString) => {
            if (!dateString) return '';
            const date = new Date(dateString + 'T12:00:00');
            return date.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        };

        const formatDateShort = (dateString) => {
            if (!dateString) return '';
            const date = new Date(dateString + 'T12:00:00');
            return date.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
        };

        const formatTime = (timeString) => {
            if (!timeString) return '';
            const [hours, minutes] = timeString.split(':');
            let h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'p. m.' : 'a. m.';
            h = h % 12;
            h = h ? h : 12;
            return `${h.toString().padStart(2, '0')}:${minutes} ${ampm}`;
        };

        const generateTimeSlots = (start, end) => {
            const slots = [];
            let current = new Date(`2000-01-01T${start}:00`);
            const endTime = new Date(`2000-01-01T${end}:00`);
            while (current <= endTime) {
                slots.push(current.toTimeString().substring(0, 5));
                current.setMinutes(current.getMinutes() + 30);
            }
            return slots;
        };

        const getDiscountedPrice = (price, discount) => {
            if (!discount) return price;
            return price * (1 - discount / 100);
        };

        const renderStars = (rating) => {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '<i class="fas fa-star"></i>';
            if (halfStar) stars += '<i class="fas fa-star-half-alt"></i>';
            for (let i = 0; i < emptyStars; i++) stars += '<i class="far fa-star empty"></i>';
            return stars;
        };

        function renderAdminOrdersTab() {
            const orders = state.orders;
            const today = state.calendarDate;
            const isWeekView = state.calendarViewMode === 'week';

            let filteredOrders = orders;
            if (!isWeekView) {
                filteredOrders = orders.filter(a => a.date === today);
            } else {
                const curr = new Date(today + 'T12:00:00');
                const first = curr.getDate() - curr.getDay();
                const weekDates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(curr);
                    d.setDate(first + i);
                    weekDates.push(d.toISOString().split('T')[0]);
                }
                filteredOrders = orders.filter(a => weekDates.includes(a.date));
            }

            return `
            <div class="bg-white border border-slate-200 rounded-[2rem] p-6 shadow-sm overflow-hidden animate-fade-in">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">

                        <button onclick="setCalendarView('week')" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest transition-all ${isWeekView ? 'bg-[#4A5B6E] text-white shadow-md' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}">Por Semana</button>

                        <i class="fas fa-chevron-left text-slate-500"></i>

                    <h4 class="text-lg font-black text-slate-800 uppercase tracking-tight text-center">${formatDate(today)}</h4>
                    <button onclick="changeCalendarDate(1)" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                        <i class="fas fa-chevron-right text-slate-500"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    ${filteredOrders.length === 0 ? `
                        <div class="text-center py-12 bg-[#F4F7FC] rounded-2xl border border-slate-200">
                            <i class="fas fa-calendar-times text-slate-300 text-4xl mb-3"></i>

            <div class="fixed inset-0 modal-overlay flex items-center justify-center z-[250] p-4">
                <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl relative text-slate-800 space-y-6 max-h-[90vh] overflow-y-auto">
                    <button onclick="closeEditPerfumeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 transition-colors"><i class="fas fa-times"></i></button>
                    <h3 class="text-xl font-bold tracking-tight text-slate-800">Editar Perfume</h3>
                    <form onsubmit="saveEditedPerfume(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Nombre del Modelo</label>
                            <input type="text" id="edit-perfume-model" value="${perfume.model}" required class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Precio (MXN)</label>
                                <input type="number" id="edit-perfume-price" value="${perfume.price}" required class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Descuento (%)</label>
                                <input type="number" id="edit-perfume-discount" value="${perfume.discount || 0}" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Rating</label>
                                <input type="number" id="edit-perfume-rating" value="${perfume.rating}" step="0.1" min="1" max="5" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Reseñas</label>
                                <input type="number" id="edit-perfume-reviews" value="${perfume.reviews}" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Tipo</label>
                                <select id="edit-perfume-type" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                                    <option value="Árabe" ${perfume.type === 'Árabe' ? 'selected' : ''}>Árabe</option>
                                    <option value="De Marca" ${perfume.type === 'De Marca' ? 'selected' : ''}>De Marca</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Género</label>
                                <select id="edit-perfume-gender" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                                    <option value="Masculino" ${perfume.gender === 'Masculino' ? 'selected' : ''}>Masculino</option>
                                    <option value="Femenino" ${perfume.gender === 'Femenino' ? 'selected' : ''}>Femenino</option>
                                    <option value="Unisex" ${perfume.gender === 'Unisex' ? 'selected' : ''}>Unisex</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Tipo de Fragancia</label>
                            <select id="edit-perfume-fragrance" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                                ${FRAGRANCE_TYPES.filter(f => f !== 'TODOS').map(f => `<option value="${f}" ${perfume.fragranceType === f ? 'selected' : ''}>${f}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Notas Olfativas</label>
                            <input type="text" id="edit-perfume-notes" value="${perfume.notes}" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Descripción</label>
                            <textarea id="edit-perfume-description" rows="2" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">${perfume.description}</textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">URLs de Imágenes (separadas por coma)</label>
                            <input type="text" id="edit-perfume-images" value="${perfume.images.join(', ')}" class="w-full bg-[#F4F7FC] border border-slate-200 rounded-2xl p-3 text-sm font-medium focus:outline-none focus:border-[#4A5B6E] focus:ring-1 focus:ring-[#4A5B6E]/20">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Color de Acento</label>
                            <div class="flex items-center gap-3">
                                <input type="color" id="edit-perfume-color-picker" value="${currentAccent}" class="w-14 h-10 rounded-xl border border-slate-200 cursor-pointer p-0.5 bg-white" onchange="updatePerfumeAccentColor(this.value)">
                                <span class="text-xs font-bold text-slate-600" id="color-hex-display">${currentAccent}</span>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                            <button type="button" onclick="closeEditPerfumeModal()" class="px-5 py-2.5 rounded-2xl text-xs font-bold bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 transition-all uppercase tracking-wider">Cancelar</button>
                            <button type="submit" class="px-5 py-2.5 rounded-2xl text-xs font-bold bg-[#4A5B6E] hover:bg-[#2D3B4A] text-white transition-all uppercase tracking-wider shadow-md">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>`;
        }

        // ---------- UTILIDADES Y MANEJADORES DE EVENTOS ----------
        function getStatusBadge(status) {
            switch (status) {
                case 'PENDING': return '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-lg text-[10px] font-black uppercase tracking-widest">Pendiente</span>';
                case 'COMPLETED': return '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-[10px] font-black uppercase tracking-widest">Completado</span>';
                case 'CANCELLED': return '<span class="px-2.5 py-1 bg-red-100 text-red-800 rounded-lg text-[10px] font-black uppercase tracking-widest">Cancelado</span>';
                default: return '';
            }
        }

        window.setView = (view) => {
            state.currentView = view;
            if (view === 'catalog') state.selectedPerfumeForBooking = null;
            render();
        };

        window.toggleBrandFilter = (brand) => {
            state.catalogFilters.activeBrand = state.catalogFilters.activeBrand === brand ? 'TODOS' : brand;
            render();
        };

        window.toggleTypeFilter = (type) => {
            state.catalogFilters.activeType = state.catalogFilters.activeType === type ? 'TODOS' : type;
            render();
        };

        window.toggleGenderFilter = (gender) => {
            state.catalogFilters.activeGender = state.catalogFilters.activeGender === gender ? 'TODOS' : gender;
            render();
        };

        window.toggleFragranceFilter = (fragrance) => {
            state.catalogFilters.activeFragrance = state.catalogFilters.activeFragrance === fragrance ? 'TODOS' : fragrance;
            render();
        };

        window.toggleDiscountFilter = () => {
            state.catalogFilters.discountOnly = !state.catalogFilters.discountOnly;
            render();
        };

        window.updateCatalogSearch = (val) => {
            state.catalogFilters.searchQuery = val;
            render();
            const input = document.getElementById('catalog-search');
            if (input) { input.focus(); const len = input.value.length; input.setSelectionRange(len, len); }
        };

        window.clearCatalogSearch = () => {
            state.catalogFilters.searchQuery = '';
            render();
        };

        window.selectPerfume = (id) => {
            const perfume = state.perfumes.find(m => m.id === id);
            if (perfume) {
                state.selectedPerfumeForBooking = perfume;
                state.currentView = 'detail';
                state.carouselIndex[id] = 0;
                render();
            }
        };

        window.nextImage = (perfumeId, total) => {
            const current = state.carouselIndex[perfumeId] || 0;
            state.carouselIndex[perfumeId] = (current + 1) % total;
            render();
        };

        window.prevImage = (perfumeId, total) => {
            const current = state.carouselIndex[perfumeId] || 0;
            state.carouselIndex[perfumeId] = (current - 1 + total) % total;
            render();
        };

        window.setImage = (perfumeId, index) => {
            state.carouselIndex[perfumeId] = index;
            render();
        };

        window.startPurchase = (id) => {
            const perfume = state.perfumes.find(m => m.id === id);
            if (perfume) {
                state.selectedPerfumeForBooking = perfume;
                state.currentView = 'booking';
                render();
            }
        };

        window.copyBankAccount = () => {
            const account = state.settings.bankAccount || 'BBVA 0123456789 (Esencia Perfumes)';
            navigator.clipboard.writeText(account).then(() => {
                const el = document.getElementById('copy-bank-text');
                if (el) el.innerText = '¡Cuenta Copiada!';
                showToast('¡Número de cuenta copiado al portapapeles!', 'success');
                setTimeout(() => { if (el) el.innerText = 'Copiar Cuenta Bancaria'; }, 2500);
            }).catch(() => showToast('No se pudo copiar', 'error'));
        };

        function showFieldError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorEl = document.getElementById('error-' + fieldId);
            if (input) input.classList.add('error');
            if (errorEl) { if (message) errorEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + message; errorEl.classList.remove('hidden'); }
        }

        function hideFieldError(fieldId) {
            const input = document.getElementById(fieldId);
            const errorEl = document.getElementById('error-' + fieldId);
            if (input) input.classList.remove('error');
            if (errorEl) errorEl.classList.add('hidden');
        }

        window.handleBookingSubmit = (e) => {
            e.preventDefault();

            ['booking-name', 'booking-phone', 'booking-details'].forEach(id => hideFieldError(id));

            const name = document.getElementById('booking-name').value.trim();
            const phone = document.getElementById('booking-phone').value.trim();
            const address = document.getElementById('booking-details').value.trim();
            const notes = document.getElementById('booking-notes').value.trim();
            const paymentMethod = document.getElementById('booking-payment').value;

            let hasError = false;
            let firstErrorField = null;

            if (!name) { showFieldError('booking-name', 'El nombre es obligatorio'); if (!firstErrorField) firstErrorField = 'booking-name'; hasError = true; }
            if (!phone || phone.length < 10) { showFieldError('booking-phone', 'Ingresa un teléfono de 10 dígitos'); if (!firstErrorField) firstErrorField = 'booking-phone'; hasError = true; }
            if (!address) { showFieldError('booking-details', 'Ingresa tu dirección de envío'); if (!firstErrorField) firstErrorField = 'booking-details'; hasError = true; }

            if (hasError) {
                showToast('Por favor corrige los campos marcados en rojo', 'error');
                if (firstErrorField) { const el = document.getElementById(firstErrorField); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus(); } }
                return;
            }

            const perfume = state.selectedPerfumeForBooking;
            const finalPrice = getDiscountedPrice(perfume.price, perfume.discount);

            const newOrder = {
                id: Date.now().toString(),
                perfume: perfume,
                customerName: name,
                customerPhone: phone,
                address: address,
                notes: notes,
                paymentMethod: paymentMethod,
                date: new Date().toISOString().split('T')[0],
                time: new Date().toTimeString().substring(0, 5),
                status: 'PENDING',
                costRefactions: 0,
                totalCharge: finalPrice,
                mechanicNotes: ''
            };

            state.orders.push(newOrder);
            showToast('¡Compra realizada exitosamente! Revisa el panel admin.', 'success');
            setView('catalog');
        };

        window.setAdminTab = (tab) => {
            state.adminTab = tab;
            state.selectedOrder = null;
            render();
        };

        window.deleteOrder = (id) => {
            state.confirmConfig = {
                isOpen: true,
                title: 'Eliminar Pedido',
                message: '¿Estás seguro de eliminar este pedido permanentemente?',
                onConfirm: () => {
                    state.orders = state.orders.filter(a => a.id !== id);
                    showToast('Pedido eliminado', 'info');
                    render();
                }
            };
            render();
        };

        window.openOrderDetail = (id) => {
            const order = state.orders.find(a => a.id === id);
            if (order) { state.selectedOrder = order; render(); }
        };

        window.closeOrderDetail = () => {
            state.selectedOrder = null;
            render();
        };

        window.updateLiquidation = (id) => {
            const costInput = document.getElementById('detail-cost-refactions');
            const chargeInput = document.getElementById('detail-total-charge');
            if (!costInput || !chargeInput) return;

            const costRef = Number(costInput.value) || 0;
            const totalCharge = Number(chargeInput.value) || 0;

            state.orders = state.orders.map(a => a.id === id ? { ...a, costRefactions: costRef, totalCharge: totalCharge } : a);
            if (state.selectedOrder && state.selectedOrder.id === id) {
                state.selectedOrder.costRefactions = costRef;
                state.selectedOrder.totalCharge = totalCharge;
            }

            const netEl = document.getElementById('detail-net-profit');
            if (netEl) netEl.textContent = '$' + (totalCharge - costRef).toFixed(2);
        };

        window.saveMechanicNotes = (id) => {
            const notesEl = document.getElementById('detail-mechanic-notes');
            if (!notesEl) return;
            const notes = notesEl.value.trim();

            state.orders = state.orders.map(a => a.id === id ? { ...a, mechanicNotes: notes } : a);
            if (state.selectedOrder && state.selectedOrder.id === id) {
                state.selectedOrder.mechanicNotes = notes;
            }
            showToast('Notas guardadas', 'success');
        };

        window.setOrderStatusFromDetail = (id, newStatus) => {
            state.orders = state.orders.map(a => a.id === id ? { ...a, status: newStatus } : a);
            if (state.selectedOrder && state.selectedOrder.id === id) {
                state.selectedOrder.status = newStatus;
            }
            showToast(`Pedido marcado como ${newStatus === 'COMPLETED' ? 'Completado' : 'Cancelado'}`, 'info');
            render();
        };

        window.deleteOrderFromDetail = (id) => {
            state.confirmConfig = {
                isOpen: true,
                title: 'Eliminar Pedido',
                message: '¿Estás seguro de eliminar este pedido permanentemente?',
                onConfirm: () => {
                    state.orders = state.orders.filter(a => a.id !== id);
                    state.selectedOrder = null;
                    showToast('Pedido eliminado', 'info');
                    render();
                }
            };
            render();
        };

        window.addNewPerfume = (e) => {
            e.preventDefault();
            const brand = document.getElementById('new-perfume-brand').value;
            const model = document.getElementById('new-perfume-model').value.trim();
            const type = document.getElementById('new-perfume-type').value;
            const gender = document.getElementById('new-perfume-gender').value;
            const fragranceType = document.getElementById('new-perfume-fragrance').value;
            const rating = document.getElementById('new-perfume-rating').value || 4.5;
            const price = document.getElementById('new-perfume-price').value;
            const discount = document.getElementById('new-perfume-discount').value || 0;
            const notes = document.getElementById('new-perfume-notes').value.trim();
            const description = document.getElementById('new-perfume-description').value.trim();
            const imagesInput = document.getElementById('new-perfume-images').value.trim();

            if (!brand || !model || !price) { showToast('Completa marca, modelo y precio', 'error'); return; }

            const images = imagesInput ? imagesInput.split(',').map(s => s.trim()) : ['https://images.unsplash.com/photo-1541643600914-78b084683601?w=600&q=80'];

            const newPerfume = {
                id: Date.now(),
                brand: brand.toUpperCase(),
                model: model.toUpperCase(),
                type: type,
                gender: gender,
                fragranceType: fragranceType,
                price: Number(price),
                discount: Number(discount),
                rating: Number(rating),
                reviews: 0,
                description: description || 'Una fragancia excepcional.',
                notes: notes || 'Notas por definir',
                images: images,
                color: '#4A5B6E'
            };
            state.perfumes.push(newPerfume);
            showToast('Perfume agregado al catálogo', 'success');
            render();
        };

        window.confirmDeletePerfume = (id) => {
            state.confirmConfig = {
                isOpen: true,
                title: 'Eliminar Perfume',
                message: '¿Estás seguro de eliminar este perfume del catálogo? Esta acción no se puede deshacer.',
                onConfirm: () => {
                    state.perfumes = state.perfumes.filter(m => m.id !== id);
                    showToast('Perfume eliminado exitosamente', 'info');
                    render();
                }
            };
            render();
        };

        window.closeConfirmModal = () => { state.confirmConfig = { ...state.confirmConfig, isOpen: false }; render(); };
        window.confirmAction = () => { if (state.confirmConfig && state.confirmConfig.onConfirm) state.confirmConfig.onConfirm(); closeConfirmModal(); };

        window.updateWorkHour = (field, value) => { state.settings.workHours[field] = value; };
        window.saveWorkHours = () => {
            const start = document.getElementById('work-start').value;
            const end = document.getElementById('work-end').value;
            state.settings.workHours = { start, end };
            showToast('Horarios de atención guardados', 'success');
            render();
        };

        window.addBlockedDate = (e) => {
            e.preventDefault();
            const dateVal = document.getElementById('new-blocked-date').value;
            if (!dateVal) return;
            if (state.settings.blockedDays.some(d => d.date === dateVal)) { showToast('Esta fecha ya está bloqueada', 'error'); return; }
            state.settings.blockedDays.push({ date: dateVal });
            showToast('Fecha bloqueada agregada', 'success');
            render();
        };

        window.removeBlockedDate = (date) => { state.settings.blockedDays = state.settings.blockedDays.filter(d => d.date !== date); render(); };

        window.saveWhatsAppNumber = () => {
            const num = document.getElementById('whatsapp-number').value.trim();
            if (!num) { showToast('Ingresa un número válido', 'error'); return; }
            state.settings.whatsappNumber = num;
            showToast('Número de WhatsApp guardado', 'success');
            render();
        };

        window.saveBankAccount = () => {
            const acc = document.getElementById('bank-account').value.trim();
            if (!acc) { showToast('Ingresa una cuenta válida', 'error'); return; }
            state.settings.bankAccount = acc;
            showToast('Cuenta bancaria guardada', 'success');
            render();
        };

        window.setCalendarView = (mode) => { state.calendarViewMode = mode; state.selectedOrder = null; render(); };

        window.changeCalendarDate = (delta) => {
            const d = new Date(state.calendarDate + 'T12:00:00');
            if (state.calendarViewMode === 'day') d.setDate(d.getDate() + delta);
            else d.setDate(d.getDate() + (delta * 7));
            state.calendarDate = d.toISOString().split('T')[0];
            state.selectedOrder = null;
            render();
        };

        window.openEditPerfumeModal = (id) => {
            const perfume = state.perfumes.find(m => m.id === id);
            if (perfume) { state.editingPerfume = JSON.parse(JSON.stringify(perfume)); state.isEditModalOpen = true; render(); }
        };

        window.closeEditPerfumeModal = () => { state.isEditModalOpen = false; state.editingPerfume = null; render(); };

        window.updatePerfumeAccentColor = (colorHex) => {
            if (state.editingPerfume) {
                state.editingPerfume.color = colorHex;
                document.getElementById('color-hex-display').textContent = colorHex;
                const previewDiv = document.querySelector('#edit-perfume-color-picker');
                if (previewDiv) previewDiv.value = colorHex;
            }
        };

        window.saveEditedPerfume = (e) => {
            e.preventDefault();
            const model = document.getElementById('edit-perfume-model').value.trim();
            const price = document.getElementById('edit-perfume-price').value;
            const discount = document.getElementById('edit-perfume-discount').value || 0;
            const rating = document.getElementById('edit-perfume-rating').value;
            const reviews = document.getElementById('edit-perfume-reviews').value;
            const type = document.getElementById('edit-perfume-type').value;
            const gender = document.getElementById('edit-perfume-gender').value;
            const fragranceType = document.getElementById('edit-perfume-fragrance').value;
            const notes = document.getElementById('edit-perfume-notes').value.trim();
            const description = document.getElementById('edit-perfume-description').value.trim();
            const imagesInput = document.getElementById('edit-perfume-images').value.trim();
            const color = document.getElementById('edit-perfume-color-picker').value;

            if (!model || !price) { showToast('Completa modelo y precio', 'error'); return; }

            const images = imagesInput ? imagesInput.split(',').map(s => s.trim()) : state.editingPerfume.images;

            const perfumeIndex = state.perfumes.findIndex(m => m.id === state.editingPerfume.id);
            if (perfumeIndex !== -1) {
                state.perfumes[perfumeIndex] = {
                    ...state.perfumes[perfumeIndex],
                    model: model,
                    price: Number(price),
                    discount: Number(discount),
                    rating: Number(rating),
                    reviews: Number(reviews),
                    type: type,
                    gender: gender,
                    fragranceType: fragranceType,
                    notes: notes,
                    description: description,
                    images: images,
                    color: color
                };
                showToast('Perfume actualizado correctamente', 'success');
            }
            closeEditPerfumeModal();
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            if (user === 'admin' && pass === 'esencia2025') {
                state.isAuthenticated = true;
                showToast('¡Sesión iniciada correctamente!', 'success');
                setView('admin');
            } else {
                showToast('Credenciales incorrectas (Usa admin / esencia2025)', 'error');
            }
        };

        window.fillDemoCredentials = () => {
            document.getElementById('login-username').value = 'admin';
            document.getElementById('login-password').value = 'esencia2025';
            showToast('Credenciales de prueba cargadas', 'info');
        };

        window.togglePasswordVisibility = () => {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('toggle-password-icon');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        };

        window.logout = () => { state.isAuthenticated = false; state.currentView = 'catalog'; showToast('Sesión cerrada', 'info'); render(); };

        window.openHeaderModal = () => { state.showHeaderModal = true; state.foundOrders = null; state.searchPhone = ''; render(); };
        window.closeHeaderModal = () => { state.showHeaderModal = false; render(); };

        window.searchOrders = (e) => {
            e.preventDefault();
            const phone = document.getElementById('header-search-phone').value.trim();
            if (!phone || phone.length < 5) { showToast('Ingresa un número de teléfono válido', 'error'); return; }
            state.searchPhone = phone;
            const filtered = state.orders.filter(a => a.customerPhone.includes(phone) && a.status === 'PENDING');
            state.foundOrders = filtered;
            render();
        };

        window.cancelOrderFromModal = (id) => {
            state.orders = state.orders.map(a => a.id === id ? { ...a, status: 'CANCELLED' } : a);
            showToast('Pedido cancelado con éxito', 'info');
            if (state.foundOrders) state.foundOrders = state.foundOrders.filter(a => a.id !== id);
            render();
        };

        window.openWhatsApp = () => {
            const num = state.settings.whatsappNumber || '522202835590';
            const text = encodeURIComponent('Hola ESENCIA, requiero atención con mi pedido de perfume.');
            window.open(`https://wa.me/${num}?text=${text}`, '_blank');
        };

        window.showToast = (message, type = 'info') => {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) { state.toast = null; render(); }
            }, 4000);
        };

        window.dismissToast = () => { state.toast = null; render(); };

        function attachGlobalListeners() {}

        // Renderizado inicial
        render();
        window.state = state;
    </script>
</body>
</html>
